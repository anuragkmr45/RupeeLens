services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upi_spend_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d upi_spend_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "56432:5432"
