openapi: 3.1.0
info:
  title: UPI Spend Tracker API
  version: 1.0.0
  summary: Backend contract for Android-first UPI Spend Tracker v1
  description: Cloud APIs for guest sessions, multi-device pairing, bootstrap config,
    sync, transactions, categories, rules, budgets, reports, and exports.
servers:
- url: https://api.example.com
  description: Production
- url: https://staging-api.example.com
  description: Staging
tags:
- name: Health
- name: Sessions
- name: Devices
- name: Bootstrap
- name: Sync
- name: Transactions
- name: Categories
- name: Merchants
- name: Rules
- name: Budgets
- name: Reports
- name: Exports
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check for the API runtime
      security: []
      responses:
        '200':
          description: API runtime is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/sessions/guest:
    post:
      tags:
      - Sessions
      summary: Create guest user session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestSessionRequest'
      responses:
        '201':
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/sessions/refresh:
    post:
      tags:
      - Sessions
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/device-pairings:
    post:
      tags:
      - Devices
      summary: Create one-time pairing code for adding another device
      responses:
        '201':
          description: Pairing code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePairingCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/device-pairings/consume:
    post:
      tags:
      - Devices
      summary: Consume one-time pairing code and join existing account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumePairingCodeRequest'
      responses:
        '200':
          description: Device paired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/devices/register:
    post:
      tags:
      - Devices
      summary: Register or update current device metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/bootstrap/config:
    get:
      tags:
      - Bootstrap
      summary: Get feature flags, parser config, and runtime compatibility info
      parameters:
      - in: query
        name: platform
        required: true
        schema:
          type: string
          enum:
          - android
          - ios
      - in: query
        name: appVersion
        required: true
        schema:
          type: string
      - in: query
        name: runtimeVersion
        required: true
        schema:
          type: string
      - in: query
        name: channel
        required: false
        schema:
          type: string
          enum:
          - internal
          - beta
          - production
      responses:
        '200':
          description: Bootstrap config
          headers:
            Cache-Control:
              description: Cache policy for the bootstrap response.
              schema:
                type: string
            ETag:
              description: Stable response tag derived from the signed bootstrap payload.
              schema:
                type: string
            Vary:
              description: Response variance policy for caches.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/sync/push:
    post:
      tags:
      - Sync
      summary: Push a batch of local operations to server
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Push processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sync/pull:
    get:
      tags:
      - Sync
      summary: Pull entity changes since cursor
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 250
      responses:
        '200':
          description: Delta sync response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transactions:
    get:
      tags:
      - Transactions
      summary: List transactions
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      - in: query
        name: status
        schema:
          type: string
          enum:
          - new
          - classified
          - partial
          - skipped
          - deleted
      - in: query
        name: merchantId
        schema:
          type: string
          format: uuid
      - in: query
        name: categoryId
        schema:
          type: string
          format: uuid
      - in: query
        name: includeDeleted
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Transactions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Transactions
      summary: Create or upsert a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpsertRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transactions/{transactionId}:
    get:
      tags:
      - Transactions
      summary: Get transaction detail
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Transactions
      summary: Update transaction
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPatchRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Transactions
      summary: Soft delete transaction
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedDeleteRequest'
      responses:
        '204':
          description: Transaction deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transactions/{transactionId}/classify:
    post:
      tags:
      - Transactions
      summary: Classify a transaction with item rows and optional rule creation
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyTransactionRequest'
      responses:
        '200':
          description: Transaction classified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/transactions/{transactionId}/items:
    post:
      tags:
      - Transactions
      summary: Create transaction item
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionItemUpsertRequest'
      responses:
        '201':
          description: Transaction item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/items:
    get:
      tags:
      - Transactions
      summary: List transaction items
      parameters:
      - in: query
        name: transactionId
        schema:
          type: string
          format: uuid
      - in: query
        name: categoryId
        schema:
          type: string
          format: uuid
      - in: query
        name: includeDeleted
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Transaction items list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItemListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/items/{itemId}:
    get:
      tags:
      - Transactions
      summary: Get transaction item
      parameters:
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Transaction item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItem'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Transactions
      summary: Update transaction item
      parameters:
      - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionItemPatchRequest'
      responses:
        '200':
          description: Transaction item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Transactions
      summary: Soft delete transaction item
      parameters:
      - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedDeleteRequest'
      responses:
        '204':
          description: Transaction item deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/categories:
    get:
      tags:
      - Categories
      summary: List categories
      parameters:
      - in: query
        name: includeDeleted
        schema:
          type: boolean
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      tags:
      - Categories
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpsertRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/merchants:
    get:
      tags:
      - Merchants
      summary: List merchants
      parameters:
      - in: query
        name: includeDeleted
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Merchants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantListResponse'
    post:
      tags:
      - Merchants
      summary: Create merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantUpsertRequest'
      responses:
        '201':
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/merchants/{merchantId}:
    get:
      tags:
      - Merchants
      summary: Get merchant
      parameters:
      - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: Merchant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Merchants
      summary: Update merchant
      parameters:
      - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantPatchRequest'
      responses:
        '200':
          description: Merchant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Merchants
      summary: Soft delete merchant
      parameters:
      - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedDeleteRequest'
      responses:
        '204':
          description: Merchant deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/categories/{categoryId}:
    patch:
      tags:
      - Categories
      summary: Update category
      parameters:
      - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags:
      - Categories
      summary: Soft delete category
      parameters:
      - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedDeleteRequest'
      responses:
        '204':
          description: Category deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/rules:
    get:
      tags:
      - Rules
      summary: List rules
      parameters:
      - in: query
        name: includeDeleted
        schema:
          type: boolean
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleListResponse'
    post:
      tags:
      - Rules
      summary: Create rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpsertRequest'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
  /v1/rules/{ruleId}:
    patch:
      tags:
      - Rules
      summary: Update rule
      parameters:
      - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePatchRequest'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
    delete:
      tags:
      - Rules
      summary: Delete rule
      parameters:
      - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedDeleteRequest'
      responses:
        '204':
          description: Rule deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/budgets:
    get:
      tags:
      - Budgets
      summary: List budgets
      parameters:
      - in: query
        name: includeDeleted
        schema:
          type: boolean
      responses:
        '200':
          description: Budgets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetListResponse'
    post:
      tags:
      - Budgets
      summary: Create budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetUpsertRequest'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
  /v1/budgets/{budgetId}:
    get:
      tags:
      - Budgets
      summary: Get budget detail
      parameters:
      - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Budget detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDetailResponse'
    patch:
      tags:
      - Budgets
      summary: Update budget
      parameters:
      - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPatchRequest'
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
    delete:
      tags:
      - Budgets
      summary: Delete budget
      parameters:
      - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedDeleteRequest'
      responses:
        '204':
          description: Budget deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/reports/summary:
    get:
      tags:
      - Reports
      summary: Get period summary
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Report summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummaryResponse'
  /v1/reports/breakdown:
    get:
      tags:
      - Reports
      summary: Get grouped spend breakdown
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: groupBy
        required: true
        schema:
          type: string
          enum:
          - category
          - merchant
          - item
          - hourOfDay
          - dayOfWeek
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      responses:
        '200':
          description: Breakdown response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportBreakdownResponse'
  /v1/exports/csv:
    post:
      tags:
      - Exports
      summary: Request CSV export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: Export accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      in: path
      name: ruleId
      required: true
      schema:
        type: string
        format: uuid
    BudgetId:
      in: path
      name: budgetId
      required: true
      schema:
        type: string
        format: uuid
    MerchantId:
      in: path
      name: merchantId
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - service
      - timestamp_utc
      properties:
        status:
          type: string
          enum:
          - healthy
        service:
          type: string
          enum:
          - api
        timestamp_utc:
          type: string
          format: date-time
    CreateGuestSessionRequest:
      type: object
      required:
      - deviceName
      - platform
      properties:
        deviceName:
          type: string
          maxLength: 120
        platform:
          type: string
          enum:
          - android
          - ios
        appVersion:
          type: string
        runtimeVersion:
          type: string
        timezone:
          type: string
        locale:
